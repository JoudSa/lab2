{% extends "layouts/base.html" %}
{% block title %}Filter Results{% endblock %}

{% block content %}
    <h2>Books ordered by title</h2>
    <ul>
    {% for book in books %}
        <li><strong>{{ book.title }}</strong> by {{ book.author }}</li>
        <hr>
    {% empty %}
        <li>No books found matching your criteria.</li>
    {% endfor %}
    </ul>
    <br>
{% endblock %}
