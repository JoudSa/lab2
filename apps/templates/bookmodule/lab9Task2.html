{% extends "layouts/base.html" %}
{% block title %} Lab 9 - Task 2 {% endblock %}

{% block content %}
    <h2>Publishers and their Book Counts</h2>
    <table border="1">
        <tr>
            <th>Publisher Name</th>
            <th>Number of Books Published</th>
        </tr>
        {% for publisher in publishers %}
        <tr>
            <td>{{ publisher.name }}</td>
            <td>{{ publisher.book_count }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
