{% extends "layouts/base.html" %}
{% block title %}Nature Photography Gallery{% endblock %}
{% block content %}
    <h2>Nature Photography Gallery</h2>
    <a href="{% url 'lab11_upload_photo' %}">+ Upload New Image</a>
    <hr>
    
    <div style="display: flex; flex-wrap: wrap; gap: 15px;">
        {% for photo in photos %}
            <div style="border: 1px solid #ddd; padding: 10px; border-radius: 8px; text-align: center;">
                <h4>{{ photo.title }}</h4>
                <img src="{{ photo.image.url }}" alt="{{ photo.title }}" style="max-width: 250px; border-radius: 5px;">
            </div>
        {% empty %}
            <p>No photos uploaded yet.</p>
        {% endfor %}
    </div>
{% endblock %}
