{% extends "layouts/base.html" %}
{% block title %} Lab 10 - Task 1.3 {% endblock %}

{% block content %}
    <h2>Edit Book</h2>
    <form method="post">
        {% csrf_token %}
        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title" value="{{ book.title }}" required><br><br>

        <label for="author">Author:</label><br>
        <input type="text" id="author" name="author" value="{{ book.author }}" required><br><br>

        <label for="edition">Edition:</label><br>
        <input type="number" id="edition" name="edition" value="{{ book.edition }}" required><br><br>

        <label for="price">Price:</label><br>
        <input type="number" id="price" name="price" step="0.01" value="{{ book.price }}" required><br><br>

        <button type="submit" style="padding: 10px; background: rgb(1, 114, 1);color: antiquewhite;">Update Book</button>
    </form>

{% endblock %}
